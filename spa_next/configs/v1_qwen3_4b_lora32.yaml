# Merged on top of v0_qwen3_4b_lora32.yaml by verl_v1_launch.
algorithm:
  adv_estimator: spa_v1
  use_kl_in_reward: false
  rollout_correction: null
  spa_v1:
    arm: C
    lambda_spa: 0.2
    gamma: 1.0
    epsilon: 0.000001
    std_threshold: 0.0001
    residual_limit: 1.0
    prm_url: http://127.0.0.1:8775
    prm_version: null
    prm_timeout: 1800
    sft_version: null
    audit_dir: outputs/v1/audit
data:
  train_batch_size: 4
  val_batch_size: 4
  shuffle: false
  seed: 42
  filter_overlong_prompts: false
actor_rollout_ref:
  model:
    lora_adapter_path: null
  actor:
    policy_loss:
      loss_mode: spa_v1_C
    data_loader_seed: 42
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    ppo_epochs: 1
    use_dynamic_bsz: false
    calculate_entropy: false
    entropy_coeff: 0
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    kl_loss_coef: 0.001
    optim:
      lr: 0.00001
      lr_warmup_steps: 0
      lr_warmup_steps_ratio: 0
      lr_scheduler_type: constant
  rollout:
    engine_kwargs:
      vllm:
        seed: 42
    n: 4
critic:
  enable: false
trainer:
  project_name: spa-v1
  total_epochs: 1
  total_training_steps: 128
  save_freq: 20
  test_freq: 64
  val_before_train: true
  max_actor_ckpt_to_keep: 3
  resume_mode: disable
